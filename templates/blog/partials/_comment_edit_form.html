<div class="comment-item p-3 mb-3" id="comment-node-{{ comment.sno }}" style="background: rgba(193,255,114,0.03); border: 1px solid rgba(193,255,114,0.3); border-radius: 12px;">
    <div class="d-flex align-items-center justify-content-between mb-2">
        <span style="font-family:var(--font-sans); font-size:12px; font-weight:700; color:var(--accent-green);">
            <i class="bi bi-pencil-square me-1"></i> EDITING PERSPECTIVE #{{ comment.sno }}
        </span>
        <span class="text-muted small">Press Save to publish changes</span>
    </div>
    <form hx-post="{% url 'editComment' %}"
          hx-target="#comment-node-{{ comment.sno }}"
          hx-swap="outerHTML">
        {% csrf_token %}
        <input type="hidden" name="comment_sno" value="{{ comment.sno }}">
        <div class="mb-3">
            <textarea name="comment" rows="3" required class="form-control"
                      style="background: rgba(0,0,0,0.4); border: 1px solid var(--border-card); color: #fff; font-size: 13.5px; border-radius: 8px; padding: 10px;">{{ comment.comment }}</textarea>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button type="submit" class="comment-submit-btn" style="padding: 6px 16px; font-size: 11px;">
                SAVE CHANGES
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary"
                    hx-get="{% url 'editComment' %}?comment_sno={{ comment.sno }}&cancel=1"
                    hx-target="#comment-node-{{ comment.sno }}"
                    hx-swap="outerHTML"
                    style="font-family:var(--font-sans); font-size:11px; letter-spacing:1px; border-radius:6px; padding: 5px 14px;">
                CANCEL
            </button>
        </div>
    </form>
</div>
