
{% extends 'base.html' %}
{% load static %}


{% block body %}

{% block custom_css %}
<link rel="stylesheet" href="{% static 'css/pages/auth.css' %}">
{% endblock custom_css %}



<form method="POST" class="form-signin">{% csrf_token %}
	<h1 class="h3 mb-3 fw-normal">Reset password</h1>
    <input name="email" class="form-control mb-3" placeholder="Email address" type="email" id="id_email" required>
	<button class="btn btn-lg btn-primary w-100" type="submit">Send reset email</button>  
</form>



{% endblock %}
